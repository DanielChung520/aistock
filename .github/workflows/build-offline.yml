name: Build Offline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/src-tauri/**'
      - 'frontend/next.config.ts'
      - '.github/workflows/build-offline.yml'

jobs:
  backend-sidecar:
    name: Backend Sidecar (PyInstaller + smoke)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps (offline set, no torch)
        shell: bash
        run: |
          grep -v -E '^torch==|^stable-baselines3' requirements.txt > requirements-offline.txt
          pip install -r requirements-offline.txt
          pip install pyinstaller
      - name: PyInstaller build
        run: pyinstaller pyinstaller-offline.spec --noconfirm --clean
      - name: Stage arangod → resources + smoke (backend /health + aistock DB 首啟)
        shell: bash
        run: |
          set -euo pipefail
          # 路徑分兩版：RT_WIN(D:/...) 給 python/原生 exe；RT_UNIX(/d/...) 給 bash 工具。
          # GNU tar 會把 D: 當遠端 host → 解壓一律用 python -m zipfile。
          RT_WIN=$(printf '%s' "$RUNNER_TEMP" | tr '\\' '/')
          RT_UNIX=$(cygpath -u "$RUNNER_TEMP")
          # ArangoDB 3.12+ 不再出 Windows 套件，3.11.14 是最後一版（EOL，僅離線版使用）
          curl -sL -o "$RT_WIN/arango.zip" \
            "https://download.arangodb.com/arangodb311/Community/Windows/ArangoDB3-3.11.14_win64.zip"
          mkdir -p ../frontend/src-tauri/resources/arangodb
          RES_UNIX=$(cd ../frontend/src-tauri/resources/arangodb && pwd)
          python -m zipfile -e "$RT_WIN/arango.zip" "$RES_UNIX"
          ARANGO_BIN_UNIX=$(find "$RES_UNIX" -name arangod.exe | head -1)
          ARANGO_BIN=$(cygpath -w "$ARANGO_BIN_UNIX")
          # Windows zip 的 js 在 <root>/usr/share/arangodb3/js
          JS_DIR=$(cygpath -w "$(find "$RES_UNIX" -type d -path '*share/arangodb3/js' | head -1)")
          echo "arangod staged: $ARANGO_BIN_UNIX"
          mkdir -p "$RT_WIN/arango-data" "$RT_WIN/arango-apps"
          "$ARANGO_BIN" --server.endpoint tcp://127.0.0.1:8530 \
            --database.directory "$RT_WIN/arango-data" \
            --server.authentication false \
            --javascript.startup-directory "$JS_DIR" \
            --javascript.app-path "$RT_WIN/arango-apps" &
          ARANGO_PID=$!
          trap 'kill ${BACKEND_PID:-} ${ARANGO_PID:-} 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:8530/_api/version" >/dev/null 2>&1 && break
            sleep 2
          done
          ./dist/aistock-backend/aistock-backend.exe &
          BACKEND_PID=$!
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:38000/health"; then
              echo "BACKEND_HEALTH_OK"
              break
            fi
            sleep 2
          done
          # 首啟建 DB 驗證：backend lifespan 的 ensure_database() 應已在全新 arangod 建出 aistock DB
          if curl -sf "http://127.0.0.1:38000/health" \
            && curl -sf "http://127.0.0.1:8530/_api/database" | grep -q '"aistock"'; then
            echo "DB_AISTOCK_CREATED_OK"
            exit 0
          fi
          echo "FAIL: /health 或 aistock DB 未建立"
          exit 1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aistock-backend-sidecar
          path: backend/dist/aistock-backend/

  frontend-sidecar:
    name: Frontend Sidecar (Next standalone + node)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Next build (standalone)
        run: pnpm run build
      - name: Assemble standalone (static + public)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .next/standalone/.next/static .next/standalone/public
          cp -r .next/static/. .next/standalone/.next/static/
          cp -r public/. .next/standalone/public/
          du -sh .next/standalone
      - name: Bundle node runtime
        shell: bash
        run: |
          set -euo pipefail
          RT_WIN=$(printf '%s' "$RUNNER_TEMP" | tr '\\' '/')
          RT_UNIX=$(cygpath -u "$RUNNER_TEMP")
          curl -sL -o "$RT_WIN/node.zip" "https://nodejs.org/dist/v20.19.0/node-v20.19.0-win-x64.zip"
          python -m zipfile -e "$RT_WIN/node.zip" "$RT_WIN"
          mkdir -p .next/standalone/node
          NODE_EXE=$(find "$RT_UNIX" -path '*node-v20*/node.exe' | head -1)
          cp "$NODE_EXE" .next/standalone/node/node.exe
          ls -la .next/standalone/node/
      - name: Smoke test (node server.js → :33300)
        shell: bash
        run: |
          set -euo pipefail
          cd .next/standalone
          export HOSTNAME=127.0.0.1 PORT=33300 BACKEND_URL=http://127.0.0.1:38000
          ./node/node.exe server.js &
          SRV_PID=$!
          trap 'kill $SRV_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -s -o /tmp/idx.html "http://127.0.0.1:33300/"; then
              echo "NEXT_SERVER_UP ($(wc -c < /tmp/idx.html) bytes)"
              exit 0
            fi
            sleep 2
          done
          echo "next :33300 timeout"
          exit 1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aistock-frontend-sidecar
          path: frontend/.next/standalone/

  package-offline:
    name: Package Offline Installer (NSIS/MSI)
    runs-on: windows-latest
    needs: [backend-sidecar, frontend-sidecar]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install pnpm deps (tauri CLI)
        run: pnpm install --frozen-lockfile
      - name: Create frontendDist placeholder
        shell: bash
        run: |
          mkdir -p .placeholder
          printf '<!doctype html><meta charset="utf-8"><title>EEA</title>\n' > .placeholder/index.html
      - name: Stage arangod into resources
        shell: bash
        run: |
          set -euo pipefail
          RT_WIN=$(printf '%s' "$RUNNER_TEMP" | tr '\\' '/')
          curl -sL -o "$RT_WIN/arango.zip" \
            "https://download.arangodb.com/arangodb311/Community/Windows/ArangoDB3-3.11.14_win64.zip"
          mkdir -p src-tauri/resources/arangodb
          python -m zipfile -e "$RT_WIN/arango.zip" src-tauri/resources/arangodb
          find src-tauri/resources/arangodb -name arangod.exe
      - name: Download backend sidecar
        uses: actions/download-artifact@v4
        with:
          name: aistock-backend-sidecar
          path: staging/backend
      - name: Download frontend sidecar
        uses: actions/download-artifact@v4
        with:
          name: aistock-frontend-sidecar
          path: staging/frontend
      - name: Stage sidecars into resources
        shell: bash
        run: |
          set -euo pipefail
          # backend onedir（dist/aistock-backend/）→ src-tauri/resources/backend/
          BE=$(dirname "$(find ../staging/backend -name aistock-backend.exe | head -1)")
          mkdir -p src-tauri/resources/backend
          cp -r "$BE/." src-tauri/resources/backend/
          # frontend standalone（artifact 根即 standalone，內含 node/）→ src-tauri/resources/next/standalone/
          # 注意 -maxdepth 1：node_modules 內也有 server.js，不能全域找
          SD=$(dirname "$(find ../staging/frontend -maxdepth 1 -name server.js | head -1)")
          mkdir -p src-tauri/resources/next
          cp -r "$SD/." src-tauri/resources/next/standalone/
          find src-tauri/resources/backend -maxdepth 1 \( -name "*.exe" -o -name "_internal" \)
          find src-tauri/resources/next/standalone -maxdepth 1 -name server.js
          find src-tauri/resources/next/standalone/node -name node.exe
      - name: E2E smoke (三程序全鏈：Next → backend → arangod)
        shell: bash
        run: |
          set -euo pipefail
          RT_WIN=$(printf '%s' "$RUNNER_TEMP" | tr '\\' '/')
          RT_UNIX=$(cygpath -u "$RUNNER_TEMP")
          RES=src-tauri/resources
          ARANGO_BIN_UNIX=$(find "$RES/arangodb" -name arangod.exe | head -1)
          ARANGO_BIN=$(cygpath -w "$ARANGO_BIN_UNIX")
          JS_DIR=$(cygpath -w "$(find "$RES/arangodb" -type d -path '*share/arangodb3/js' | head -1)")
          mkdir -p "$RT_WIN/e2e-data" "$RT_WIN/e2e-apps"
          "$ARANGO_BIN" --server.endpoint tcp://127.0.0.1:8530 \
            --database.directory "$RT_WIN/e2e-data" \
            --server.authentication false \
            --javascript.startup-directory "$JS_DIR" \
            --javascript.app-path "$RT_WIN/e2e-apps" &
          ARANGO_PID=$!
          "$RES/backend/aistock-backend.exe" --host 127.0.0.1 --port 38000 &
          BACKEND_PID=$!
          (cd "$RES/next/standalone" && HOSTNAME=127.0.0.1 PORT=33300 BACKEND_URL=http://127.0.0.1:38000 ./node/node.exe server.js) &
          NODE_PID=$!
          trap 'kill ${ARANGO_PID:-} ${BACKEND_PID:-} ${NODE_PID:-} 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:38000/health >/dev/null 2>&1 \
              && curl -sf -o /dev/null http://127.0.0.1:33300/ 2>&1; then
              echo "ALL_UP"
              break
            fi
            sleep 2
          done
          # 全鏈驗證：Next proxy → backend → arangod（watchlist 只讀 DB，確定性）
          code=$(curl -s -o /tmp/wl.json -w "%{http_code}" "http://127.0.0.1:33300/api/watchlist")
          echo "CHAIN_STATUS=$code"
          head -c 200 /tmp/wl.json; echo
          if [ "$code" = "200" ] \
            && curl -sf "http://127.0.0.1:8530/_api/database" | grep -q '"aistock"'; then
            echo "E2E_OFFLINE_OK"
            exit 0
          fi
          echo "E2E_OFFLINE_FAIL"
          exit 1
      - name: Tauri build (offline config)
        shell: bash
        run: |
          set -euo pipefail
          CFG=$(printf '%s/frontend/src-tauri/tauri.offline.conf.json' "$GITHUB_WORKSPACE" | tr '\\' '/')
          pnpm tauri build --config "$CFG" --bundles nsis,msi
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: aistock-offline-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
