name: Build Offline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/build-offline.yml'

jobs:
  backend-sidecar:
    name: Backend Sidecar (PyInstaller + smoke)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps (offline set, no torch)
        shell: bash
        run: |
          grep -v -E '^torch==|^stable-baselines3' requirements.txt > requirements-offline.txt
          pip install -r requirements-offline.txt
          pip install pyinstaller
      - name: Diagnose src.data resolution
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          import src, src.data, src.main
          print('DIAG src =', src.__file__)
          print('DIAG src.data =', src.data.__file__)
          print('DIAG_OK')
          PY
      - name: PyInstaller build
        run: pyinstaller pyinstaller-offline.spec --noconfirm --clean --log-level DEBUG
      - name: Smoke test (arangod 3.11.14 + backend /health)
        shell: bash
        run: |
          set -euo pipefail
          # GNU tar 會把 `D:` 當成遠端 host，故解壓用 python；路徑分兩版：
          #   RT_WIN  (D:/...) 給 python 與原生 exe（arangod.exe）
          #   RT_UNIX (/d/...) 給 bash 工具（find）
          RT_WIN=$(printf '%s' "$RUNNER_TEMP" | tr '\\' '/')
          RT_UNIX=$(cygpath -u "$RUNNER_TEMP")
          # ArangoDB 3.12+ 不再出 Windows 套件，3.11.14 是最後一版（EOL，僅離線版使用）
          curl -sL -o "$RT_WIN/arango.zip" \
            "https://download.arangodb.com/arangodb311/Community/Windows/ArangoDB3-3.11.14_win64.zip"
          python -m zipfile -e "$RT_WIN/arango.zip" "$RT_WIN"
          ARANGO_BIN_UNIX=$(find "$RT_UNIX" -name arangod.exe | head -1)
          ARANGO_BIN=$(cygpath -w "$ARANGO_BIN_UNIX")
          # Windows zip 的 js 目錄在 <root>/usr/share/arangodb3/js，動態找避免硬編
          JS_DIR_UNIX=$(find "$RT_UNIX" -type d -path "*share/arangodb3/js" | head -1)
          JS_DIR=$(cygpath -w "$JS_DIR_UNIX")
          mkdir -p "$RT_WIN/arango-data" "$RT_WIN/arango-apps"
          "$ARANGO_BIN" --server.endpoint tcp://127.0.0.1:8530 \
            --database.directory "$RT_WIN/arango-data" \
            --server.authentication false \
            --javascript.startup-directory "$JS_DIR" \
            --javascript.app-path "$RT_WIN/arango-apps" &
          ARANGO_PID=$!
          trap 'kill ${BACKEND_PID:-} ${ARANGO_PID:-} 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:8530/_api/version" >/dev/null 2>&1 && break
            sleep 2
          done
          ./dist/aistock-backend/aistock-backend.exe &
          BACKEND_PID=$!
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:38000/health"; then
              echo "BACKEND_HEALTH_OK"
              exit 0
            fi
            sleep 2
          done
          echo "backend /health timeout"
          exit 1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aistock-backend-sidecar
          path: backend/dist/aistock-backend/
